<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HAR Analyzer Installed</title>
    <meta
      name="description"
      content="Pin HAR Analyzer in Chrome and open its side panel."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>HAR Analyzer Installed</h1>
      <p class="lead">
        Click the puzzle piece (1) in the top right of your browser. Then click the pin icon (2) next to HAR Analyzer:
      </p>

      <figure class="shot">
        <img
          src="assets/welcome_2.png"
          alt="Open the Chrome extensions menu and pin HAR Analyzer"
          width="1476"
          height="1066"
        />
      </figure>

      <p class="lead">
        Open HAR Analyzer (3) on a website to upload a HAR file or start live capture:
      </p>

      <figure class="shot">
        <img
          src="assets/welcome_3.png"
          alt="Open HAR Analyzer from the Chrome toolbar"
          width="1470"
          height="1070"
        />
      </figure>
    </main>
  </body>
</html>
